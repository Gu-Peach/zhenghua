[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zhenghua-agent-service"
version = "0.1.0"
description = "Independent agent runtime for electrical drawing extraction."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111",
  "httpx>=0.27",
  "langgraph>=0.2",
  "openpyxl>=3.1",
  "pydantic>=2.7",
  "PyMuPDF>=1.24",
  "xlrd>=2.0.1",
  "xlwt>=1.3.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["agent_service"]

[[tool.mypy.overrides]]
module = ["pymupdf"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["fitz", "openpyxl", "openpyxl.*", "xlrd", "xlwt"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["langgraph", "langgraph.*"]
follow_imports = "skip"
