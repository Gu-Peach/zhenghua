[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wiring-server"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.111", "httpx>=0.27", "pydantic>=2.7", "uvicorn>=0.30", "asyncpg>=0.30"]

[tool.setuptools.packages.find]
where = ["src"]
